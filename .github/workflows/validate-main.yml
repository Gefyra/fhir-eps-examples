name: Validate main

on:
  push:
    branches: [main]
  # Weekly, so that terminology drift and new validator behaviour become visible.
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-main
  cancel-in-progress: false

jobs:
  validate:
    name: Validate everything and build the site
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      # Full history: the submission date is derived from the first commit.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-validator

      # Errors in the examples are expected and must not turn main red.
      - name: Validate
        id: validate
        continue-on-error: true
        run: python -m tools validate --all --out results/

      - name: Build the report and the site
        if: always()
        run: >-
          python -m tools report
          --results results/
          --site site/
          --run-url ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          --job-summary
          --no-baseline

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: main-results
          path: results/
          retention-days: 30

      - name: Upload the site
        if: steps.validate.outcome == 'success'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      # A crashed validator blocks the deploy: the old site stays up.
      - name: Fail if the validator crashed
        if: steps.validate.outcome == 'failure'
        run: |
          echo "The validator crashed; the site was not deployed." >&2
          exit 1

  deploy:
    name: Deploy to GitHub Pages
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

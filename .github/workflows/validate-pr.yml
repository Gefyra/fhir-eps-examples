name: Validate PR

# No paths filter: the check job must report on every pull request so that it
# can be a required status check.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: validate-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  check:
    name: Structural checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      has_targets: ${{ steps.changed.outputs.has_targets }}
      full: ${{ steps.changed.outputs.full }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install the tooling
        run: pip install -e .

      - name: Determine what changed
        id: changed
        run: >-
          python -m tools changed
          --base ${{ github.event.pull_request.base.sha }}
          --head ${{ github.event.pull_request.head.sha }}
          --output .ci/changed.json
          --github-output

      - name: Structural checks
        run: python -m tools check --changed .ci/changed.json --github --summary .ci/check-summary.md

      # Always: the comment workflow needs a body even when the checks failed.
      - name: Collect the pull request context
        if: always()
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          mkdir -p .ci
          printf '{"number": %s, "head_sha": "%s", "base_sha": "%s"}\n' \
            "$PR_NUMBER" "$HEAD_SHA" "$BASE_SHA" > .ci/pr.json

      - name: Render the fallback comment
        if: always()
        run: >-
          python -m tools report
          --results .ci/none
          --check-summary .ci/check-summary.md
          --pr-comment .ci/pr-comment.md
          --run-url ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          --no-baseline

      - name: Upload the pull request context
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr-context
          path: .ci/
          retention-days: 7
          # .ci is a dot directory; upload-artifact skips hidden files by default.
          include-hidden-files: true
          if-no-files-found: error

  validate:
    name: FHIR validation
    needs: check
    if: ${{ needs.check.outputs.has_targets == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - name: Download the pull request context
        uses: actions/download-artifact@v8
        with:
          name: pr-context
          path: .ci

      - uses: ./.github/actions/setup-validator

      # Validation findings never fail this job; only a crashing validator does.
      - name: Validate
        id: validate
        continue-on-error: true
        run: python -m tools validate --changed .ci/changed.json --out results/

      - name: Render the report
        if: always()
        run: >-
          python -m tools report
          --results results/
          --check-summary .ci/check-summary.md
          --pr-comment .ci/pr-comment.md
          --run-url ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          --job-summary

      - name: Upload the results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-results
          path: |
            results/
            .ci/pr-comment.md
          retention-days: 14
          include-hidden-files: true
          if-no-files-found: error

      - name: Fail if the validator crashed
        if: steps.validate.outcome == 'failure'
        run: |
          echo "The validator crashed. The affected files are reported as not validated." >&2
          echo "This is an infrastructure problem, not a problem with the examples." >&2
          exit 1

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fhir-eps-tools"
version = "1.0.0"
description = "Structural checks, FHIR validation and reporting for the fhir-eps-examples collection"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pyyaml>=6.0,<7",
    "jsonschema>=4.21,<5",
    "jinja2>=3.1,<4",
    "pygments>=2.17,<3",
    "markdown>=3.5,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10"]

[tool.setuptools]
packages = ["tools"]

[tool.setuptools.package-data]
tools = ["templates/*.j2", "static/*", "data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
